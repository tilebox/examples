[project]
name = "s2-sen2cor"
version = "0.1.0"
description = "Sentinel-2 atmospheric correction, NDVI and a Tilebox results catalog"
requires-python = ">=3.12"
dependencies = [
  "tilebox>=0.1.0",
  "tilebox-datasets>=0.61.0",
  "tilebox-storage",
  "azure-identity>=1.25.0",
  "obstore>=0.11.1,<0.12",
  "numpy>=2.2.0",
  "rasterio>=1.4.3",
  "pillow>=11.3.0",
  "defusedxml>=0.7.1",
]

[dependency-groups]
dev = ["pytest>=8.4.1", "ruff>=0.12.7"]
notebook = ["jupyterlab>=4.4", "matplotlib>=3.10", "jupytext>=1.17"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
