[project]
name = "workflows-cron-automation-py"
version = "0.1.0"
description = "Tilebox Workflows Cron Automation, Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
    "shapely>=2.0.7",
    "tilebox-datasets>=0.59.0",
    "tilebox-grpc>=0.59.0",
    "tilebox-workflows[geospatial]>=0.59.0",
]

[dependency-groups]
dev = ["pyright>=1.1.409", "ruff>=0.15.0"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM", "CPY", "D", "G004", "ISC001", "T201"]

[tool.pyright]
venvPath = "."
venv = ".venv"
