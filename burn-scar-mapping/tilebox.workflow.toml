[workflow]
slug = "burn-scar-mapping"
name = "Burn Scar Mapping"
description = "Identify likely burn scars by comparing Sentinel-2 imagery before and after a fire, and highlight them on a satellite image."
root = "."
runner = "runner:runner"

[build]
include = [
  "pyproject.toml",
  "uv.lock",
  "**/*.py",
]
# Respect .gitignore when selecting files for the release.
use_gitignore = true
