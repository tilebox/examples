[workflow]
slug = "seasonal-rgb-timelapse"
name = "Seasonal RGB Timelapse"
description = "Build low-cloud seasonal Sentinel-2 RGB timelapses"
root = "."
runner = "runner:runner"

[build]
include = [
  "pyproject.toml",
  "uv.lock",
  "**/*.py",
  "assets/**",
]
# Respect .gitignore when selecting files for the release.
use_gitignore = true
