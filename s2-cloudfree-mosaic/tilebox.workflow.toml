[workflow]
slug = "sentinel-2-cloudfree-mosaic"
name = "Sentinel-2 Cloud-Free Mosaic"
description = "Combine Sentinel-2 observations into a cloud-masked, natural-color mosaic for a chosen area and date range."
root = "."
runner = "runner:runner"

[build]
include = [
  "pyproject.toml",
  "uv.lock",
  "**/*.py",
]
# Respect .gitignore when selecting files for the release.
use_gitignore = true
